version: 1

filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  - /app
  - /proc/self
  - /dev/urandom
  - /sandbox/.venv
  read_write:
  - /workspace
  - /tmp
  - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  pypi:
    name: PyPI
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }

  vllm:
    name: vLLM on RHOAI cluster
    endpoints:
      - host: vllm-api-user-egallen.apps.ocp.cloud.rhai-tmm.dev
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: full
